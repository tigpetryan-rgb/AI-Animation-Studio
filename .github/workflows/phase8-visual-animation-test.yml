name: Phase 8 Visual Animation Test

on:
  workflow_dispatch:
  push:
    branches: ["m58/**"]
    paths:
      - "apps/studio-runtime-android/app/build.gradle.kts"
      - "apps/studio-runtime-android/app/src/main/java/com/aianimationstudio/runtime/NativePhase8CodecExporter.kt"
      - "apps/studio-runtime-android/app/src/main/java/com/aianimationstudio/runtime/NativePhase8CodecContract.kt"
      - "apps/studio-runtime-android/app/src/main/java/com/aianimationstudio/runtime/NativePhase8RenderPipeline.kt"
      - "apps/studio-runtime-android/app/src/androidTest/java/com/aianimationstudio/runtime/NativePhase8VisualAnimationInstrumentedTest.kt"
      - "scripts/phase8-visual-emulator-test.sh"
      - ".github/workflows/phase8-visual-animation-test.yml"

jobs:
  render-viewable-native-animation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render actual Phase 8 3D animation in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/phase8-visual-emulator-test.sh

      - name: Verify visual artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          MP4="$(find phase8-visual-artifact -maxdepth 1 -type f -name 'phase8-visual-*.mp4' | head -n 1)"
          test -n "$MP4"
          test -s "$MP4"
          test -s phase8-visual-artifact/phase8-visual-preview-1.png
          test -s phase8-visual-artifact/phase8-visual-preview-2.png
          test -s phase8-visual-artifact/phase8-visual-preview-3.png
          test -s phase8-visual-artifact/phase8-visual-manifest.txt
          sha256sum "$MP4"
          cat phase8-visual-artifact/phase8-visual-manifest.txt

      - name: Upload viewable Phase 8 animation
        uses: actions/upload-artifact@v4
        with:
          name: phase8-visual-animation-${{ github.sha }}
          path: phase8-visual-artifact/
          if-no-files-found: error
          retention-days: 14
