name: Native Android CI

on:
  push:
    branches: ["m56/**", "m57/**"]
  pull_request:
    branches: [main]
    paths:
      - "apps/studio-runtime-android/**"
      - ".github/workflows/native-android-ci.yml"

jobs:
  verify-native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Capture canonical source identity
        run: |
          SOURCE_SHA="$GITHUB_SHA"
          SOURCE_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "AISTUDIO_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "AISTUDIO_SOURCE_DATE=$SOURCE_DATE" >> "$GITHUB_ENV"

      - name: Verify native-only runtime boundary
        run: |
          if grep -R --line-number --fixed-strings "android.webkit." apps/studio-runtime-android/app/src/main; then
            echo "android.webkit browser bridge/reference found in native runtime source." >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings "androidx.webkit" apps/studio-runtime-android/app/src/main apps/studio-runtime-android/app/build.gradle.kts; then
            echo "androidx.webkit reference found in native runtime." >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings "StudioRuntimeBridge" apps/studio-runtime-android/app/src/main; then
            echo "Legacy StudioRuntimeBridge found in native runtime source." >&2
            exit 1
          fi
          if grep -n --fixed-strings "build:web" apps/studio-runtime-android/app/build.gradle.kts; then
            echo "Studio Web build is still coupled to the native APK." >&2
            exit 1
          fi

      - name: Verify no provider secret is packaged in native source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|anthropic_[A-Za-z0-9_-]{20,}' \
            apps/studio-runtime-android/app/src/main apps/studio-runtime-android/app/build.gradle.kts; then
            echo "Provider credential-like literal found in native Android source." >&2
            exit 1
          fi
          if grep -n -E 'buildConfigField\([^,]+,[[:space:]]*"[A-Z0-9_]*(API_KEY|SECRET|TOKEN)[A-Z0-9_]*"' \
            apps/studio-runtime-android/app/build.gradle.kts; then
            echo "Provider secret/token BuildConfig field found in native APK configuration." >&2
            exit 1
          fi

      - name: M57 300-case multilingual semantic benchmark
        working-directory: apps/studio-runtime-android
        run: |
          ./gradlew \
            :app:testReleaseUnitTest \
            --tests "com.aianimationstudio.runtime.M57MultilingualSemanticBenchmarkTest" \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="0.3.0-m57-ci+${AISTUDIO_SOURCE_SHA:0:12}" \
            -PruntimeVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon

      - name: Kotlin and Android verification
        working-directory: apps/studio-runtime-android
        run: |
          set -euo pipefail
          RUNTIME_VERSION="0.3.0-m57-ci+${AISTUDIO_SOURCE_SHA:0:12}"
          ./gradlew \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="${RUNTIME_VERSION}" \
            -PruntimeVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon

      - name: Verify built native APK exists
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "Built native APK is missing or empty at expected path: $APK" >&2
            exit 1
          fi
          echo "Built native APK checkpoint PASS: $APK"

      - name: Verify native APK signature
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK apksigner was not found under $ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "Native APK signature checkpoint PASS."

      - name: Verify native APK embeds exact source SHA
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if ! unzip -p "$APK" 'classes*.dex' | grep -a --fixed-strings "$AISTUDIO_SOURCE_SHA" >/dev/null; then
            echo "Built native APK does not embed the exact workflow source SHA." >&2
            exit 1
          fi
          echo "Embedded exact source SHA checkpoint PASS."

      - name: Verify native APK browser-free bytecode
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          for forbidden in \
            'Landroid/webkit/WebView;' \
            'Landroid/webkit/JavascriptInterface;' \
            'Lcom/aianimationstudio/runtime/StudioRuntimeBridge;'
          do
            if unzip -p "$APK" 'classes*.dex' | grep -a --fixed-strings "$forbidden" >/dev/null; then
              echo "Built native APK contains forbidden browser runtime bytecode reference: $forbidden" >&2
              exit 1
            fi
          done
          echo "Browser-free bytecode checkpoint PASS."

      - name: Verify no provider secret is packaged in native APK
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if unzip -p "$APK" 'classes*.dex' | grep -a -E 'sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|anthropic_[A-Za-z0-9_-]{20,}' >/dev/null; then
            echo "Built native APK contains a provider credential-like literal." >&2
            exit 1
          fi
          echo "Provider-secret APK checkpoint PASS."

      - name: Compute M57 APK SHA-256
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          if [[ ! "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "APK SHA-256 extraction did not return a canonical 64-character lowercase digest." >&2
            exit 1
          fi
          echo "M57_APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "APK SHA-256 checkpoint PASS: $APK_SHA256"

      - name: Extract M57 APK signer certificate SHA-256
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android SDK apksigner was not found while extracting signer provenance." >&2
            exit 1
          fi
          CERTS_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          SIGNER_SHA256="$(printf '%s\n' "$CERTS_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [[ ! "$SIGNER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Signer certificate SHA-256 extraction did not return a canonical 64-character digest." >&2
            printf '%s\n' "$CERTS_OUTPUT" >&2
            exit 1
          fi
          SIGNER_SHA256="${SIGNER_SHA256,,}"
          echo "M57_SIGNER_SHA256=$SIGNER_SHA256" >> "$GITHUB_ENV"
          echo "Signer certificate SHA-256 checkpoint PASS: $SIGNER_SHA256"

      - name: Write M57 APK provenance manifest
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          PROVENANCE="app/build/outputs/apk/release/M57_PROVENANCE.txt"
          RUNTIME_VERSION="0.3.0-m57-ci+${AISTUDIO_SOURCE_SHA:0:12}"
          cat > "$PROVENANCE" <<EOF
          schema_version=1
          repository=${GITHUB_REPOSITORY}
          branch=${GITHUB_REF_NAME}
          source_sha=${AISTUDIO_SOURCE_SHA}
          source_date=${AISTUDIO_SOURCE_DATE}
          workflow_name=${GITHUB_WORKFLOW}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_number=${GITHUB_RUN_NUMBER}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          runtime_kind=NATIVE_ANDROID_COMPOSE
          runtime_version=${RUNTIME_VERSION}
          apk_filename=app-release.apk
          apk_sha256=${M57_APK_SHA256}
          signer_certificate_sha256=${M57_SIGNER_SHA256}
          EOF
          test -s "$PROVENANCE"
          echo "M57 provenance manifest write checkpoint PASS."

      - name: Verify M57 provenance source SHA
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          PROVENANCE="app/build/outputs/apk/release/M57_PROVENANCE.txt"
          grep -Fx "source_sha=${AISTUDIO_SOURCE_SHA}" "$PROVENANCE"
          echo "M57 provenance source SHA checkpoint PASS."

      - name: Verify M57 provenance APK SHA-256
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          PROVENANCE="app/build/outputs/apk/release/M57_PROVENANCE.txt"
          grep -Fx "apk_sha256=${M57_APK_SHA256}" "$PROVENANCE"
          echo "M57 provenance APK SHA-256 checkpoint PASS."

      - name: Verify M57 provenance signer SHA-256
        working-directory: apps/studio-runtime-android
        shell: bash
        run: |
          set -euo pipefail
          PROVENANCE="app/build/outputs/apk/release/M57_PROVENANCE.txt"
          grep -Fx "signer_certificate_sha256=${M57_SIGNER_SHA256}" "$PROVENANCE"
          echo "M57 provenance signer SHA-256 checkpoint PASS."

      - name: Upload native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-native-android-${{ env.AISTUDIO_SOURCE_SHA }}
          path: |
            apps/studio-runtime-android/app/build/outputs/apk/release/app-release.apk
            apps/studio-runtime-android/app/build/outputs/apk/release/M57_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
