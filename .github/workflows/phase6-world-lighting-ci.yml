name: Phase 6 World Lighting CI

on:
  push:
    branches: ["m58/**"]
    paths:
      - "apps/studio-runtime-android/**"
      - ".github/workflows/phase6-world-lighting-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/studio-runtime-android/**"
      - ".github/workflows/phase6-world-lighting-ci.yml"

jobs:
  verify-phase6-world-lighting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Capture exact source identity
        run: |
          SOURCE_SHA="$GITHUB_SHA"
          SOURCE_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "AISTUDIO_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "AISTUDIO_SOURCE_DATE=$SOURCE_DATE" >> "$GITHUB_ENV"

      - name: Phase 6 canonical world spatial contact and lighting gate
        working-directory: apps/studio-runtime-android
        run: |
          ./gradlew \
            :app:testReleaseUnitTest \
            --tests "com.aianimationstudio.runtime.NativeWorldLightingPhase6Test" \
            --tests "com.aianimationstudio.runtime.NativeWorldBoundPerformancePhase6Test" \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="0.8.0-phase6-ci+${AISTUDIO_SOURCE_SHA:0:12}" \
            -PruntimeVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon

      - name: Phase 6 contract summary
        run: |
          echo "Phase 6 gate PASS on exact SHA ${AISTUDIO_SOURCE_SHA}"
          echo "Verified: one canonical world state replaces rehearsal anchors, rebases accepted actor root tracks and camera coverage, binds RIGHT_HAND/PROP_GRASP contacts to canonical prop anchors, applies deterministic prop ownership/state transitions, keeps actor/camera collision clearance inside environment bounds, evaluates key/fill/rim/environment exposure, preserves camera-aware subject visibility, and reproduces identical world-bound actor + Phase-6 production plans on replay."
