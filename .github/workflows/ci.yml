name: Foundation CI

on:
  push:
    branches: [main, "foundation/**", "m54/physical-device-export-evidence", "m55/**"]
  pull_request:
    branches: [main, "m51-53/production-validation", "m54/physical-device-export-evidence"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: npm install

      - name: Capture canonical source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SOURCE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          SOURCE_DATE="$(git show -s --format=%cI "${SOURCE_SHA}")"
          echo "AISTUDIO_SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "AISTUDIO_SOURCE_DATE=${SOURCE_DATE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${SOURCE_SHA}")" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Studio Web
        run: npm run build:web

      - name: Build Android controlled runtime
        working-directory: apps/studio-runtime-android
        run: |
          ./gradlew :app:assembleDebug \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="0.1.0-ci+${AISTUDIO_SOURCE_SHA:0:12}" \
            -PgenerationApiBaseUrl="${{ vars.AISTUDIO_GENERATION_API_BASE_URL }}" \
            --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-runtime-android-${{ env.AISTUDIO_SOURCE_SHA }}
          path: apps/studio-runtime-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Chromium browser smoke and export stress
        run: npm run test:browser

      - name: Browser compatibility matrix
        run: npm run test:browser:compat

      - name: Build release candidate package
        run: |
          npm run release:manifest
          bash scripts/package-release-candidate.sh

      - name: Verify release candidate checksum
        run: |
          cd release
          sha256sum -c AI-Animation-Studio-Web-RC.zip.sha256

      - name: Verify extracted release candidate
        run: |
          rm -rf /tmp/aistudio-rc-check
          mkdir -p /tmp/aistudio-rc-check
          unzip -q release/AI-Animation-Studio-Web-RC.zip -d /tmp/aistudio-rc-check
          cd /tmp/aistudio-rc-check
          sha256sum -c studio-web-files.sha256
          test -f studio-web/index.html
          test -f studio-web/sw.js
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("studio-web-release-manifest.json","utf8")); if(m.source.commit!==process.env.AISTUDIO_SOURCE_SHA){throw new Error(`Manifest source mismatch: ${m.source.commit} != ${process.env.AISTUDIO_SOURCE_SHA}`)}'
          grep -q "${AISTUDIO_SOURCE_SHA}" studio-web/assets/*.js

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-web-rc-${{ env.AISTUDIO_SOURCE_SHA }}
          path: |
            release/AI-Animation-Studio-Web-RC.zip
            release/AI-Animation-Studio-Web-RC.zip.sha256
            release/studio-web-release-manifest.json
            release/studio-web-files.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
