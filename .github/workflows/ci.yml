name: Foundation CI

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:
    branches: [main]

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture canonical source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SOURCE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          echo "AISTUDIO_SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Typecheck retained foundation
        run: npm run typecheck

      - name: Unit tests retained foundation
        run: npm test

      - name: Legacy Studio Web compatibility build (non-production)
        continue-on-error: true
        run: npm run legacy:web:build

      - name: Canonical direction guard
        run: |
          grep -q 'native Android' CANONICAL_MASTER_PLAN.md
          grep -q 'Browser/PWA/WebKit/Chromium as the final production runtime' CANONICAL_MASTER_PLAN.md
          test -f AGENTS.md
          echo "Foundation CI does not create a production Web RC. Native Android release evidence belongs to Native Android CI."
