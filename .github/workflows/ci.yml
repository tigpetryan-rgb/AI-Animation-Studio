name: Foundation CI

on:
  push:
    branches: [main, "foundation/**", "m54/physical-device-export-evidence", "m55/**", "m56/**", "m57/**", "m58/**"]
  pull_request:
    branches: [main, "m51-53/production-validation", "m54/physical-device-export-evidence"]

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: npm install

      - name: Capture canonical source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SOURCE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          SOURCE_DATE="$(git show -s --format=%cI "${SOURCE_SHA}")"
          echo "AISTUDIO_SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "AISTUDIO_SOURCE_DATE=${SOURCE_DATE}" >> "$GITHUB_ENV"

      - name: Typecheck retained foundation
        run: npm run typecheck

      - name: Unit tests retained foundation
        run: npm test

      - name: Native Android debug compile checkpoint
        working-directory: apps/studio-runtime-android
        run: |
          ./gradlew :app:assembleDebug \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="0.4.0-m58-foundation+${AISTUDIO_SOURCE_SHA:0:12}" \
            -PruntimeVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Legacy Studio Web compatibility build (non-production)
        continue-on-error: true
        run: npm run legacy:web:build

      - name: Install legacy browser test engines (non-production)
        continue-on-error: true
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Legacy Chromium compatibility smoke (non-production)
        continue-on-error: true
        run: npm run legacy:web:test:browser

      - name: Legacy browser compatibility matrix (non-production)
        continue-on-error: true
        run: npm run legacy:web:test:compat

      - name: Canonical direction guard
        run: |
          grep -q 'native Android' CANONICAL_MASTER_PLAN.md
          test -f AGENTS.md
          echo "Foundation CI creates no production Web RC and uploads no release artifact."
          echo "Native Android CI is the APK/provenance/release gate for the current production path."
