name: Foundation CI

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Studio Web
        run: npm run build:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:browser

      - name: Capture canonical source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SOURCE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          echo "AISTUDIO_SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${SOURCE_SHA}")" >> "$GITHUB_ENV"

      - name: Build release candidate package
        run: |
          npm run release:manifest
          bash scripts/package-release-candidate.sh

      - name: Verify release candidate checksum
        run: sha256sum -c release/AI-Animation-Studio-Web-RC.zip.sha256

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-web-rc-${{ env.AISTUDIO_SOURCE_SHA }}
          path: |
            release/AI-Animation-Studio-Web-RC.zip
            release/AI-Animation-Studio-Web-RC.zip.sha256
            release/studio-web-release-manifest.json
            release/studio-web-files.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
