name: Phase 3 Character CI

on:
  push:
    branches: ["m58/**"]
    paths:
      - "apps/studio-runtime-android/**"
      - ".github/workflows/phase3-character-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/studio-runtime-android/**"
      - ".github/workflows/phase3-character-ci.yml"

jobs:
  verify-phase3-character-definition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36"

      - name: Capture exact source identity
        run: |
          SOURCE_SHA="$GITHUB_SHA"
          SOURCE_DATE="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "AISTUDIO_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "AISTUDIO_SOURCE_DATE=$SOURCE_DATE" >> "$GITHUB_ENV"

      - name: Phase 3 character reconstruction and persistence gate
        working-directory: apps/studio-runtime-android
        run: |
          ./gradlew \
            :app:testReleaseUnitTest \
            --tests "com.aianimationstudio.runtime.NativeCharacterDefinition3DTest" \
            --tests "com.aianimationstudio.runtime.NativeCharacterModel3DTest" \
            -PstudioCommitSha="${AISTUDIO_SOURCE_SHA}" \
            -PstudioSourceDate="${AISTUDIO_SOURCE_DATE}" \
            -PruntimeVersion="0.5.0-phase3-ci+${AISTUDIO_SOURCE_SHA:0:12}" \
            -PruntimeVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon

      - name: Phase 3 contract summary
        run: |
          echo "Phase 3 gate PASS on exact SHA ${AISTUDIO_SOURCE_SHA}"
          echo "Verified: real 3D topology, humanoid rig/skinning, UV/material regions, exact reference appearance ownership, checksummed save/reopen, exact reference restoration, and fail-closed tamper/identity checks."
